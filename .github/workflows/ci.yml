name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Qt majors on Linux, from the distribution: this is the
          # combination the project is developed against.
          - name: linux gcc Qt 6 Debug
            os: ubuntu-24.04
            qt: 6
            qt_source: apt
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
          - name: linux gcc Qt 6 Release
            os: ubuntu-24.04
            qt: 6
            qt_source: apt
            cc: gcc
            cxx: g++
            build_type: Release
          - name: linux clang Qt 6 Release
            os: ubuntu-24.04
            qt: 6
            qt_source: apt
            cc: clang
            cxx: clang++
            build_type: Release
          - name: linux gcc Qt 5 Release
            os: ubuntu-24.04
            qt: 5
            qt_source: apt
            cc: gcc
            cxx: g++
            build_type: Release
          # The other two platforms, with the official Qt build.
          - name: macos Qt 6 Release
            os: macos-15
            qt: 6
            qt_source: aqt
            build_type: Release
          - name: windows msvc Qt 6 Release
            os: windows-2022
            qt: 6
            qt_source: aqt
            build_type: Release

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies (Linux)
        if: matrix.qt_source == 'apt'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y --no-install-recommends qt6-base-dev
          else
            sudo apt-get install -y --no-install-recommends qtbase5-dev
          fi

      # Only GTK/module-free qtbase is needed: the program links Widgets.
      - name: Install Qt (macOS and Windows)
        if: matrix.qt_source == 'aqt'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          args=(-G Ninja
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                -DQTIMAGEVIEWER_QT_VERSION=${{ matrix.qt }}
                -DGIT_SHA=${GITHUB_SHA})
          if [ -n "${{ matrix.cc }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          # The sanitizers are off by default so that the program is a normal
          # build; the Debug job is where they are wanted.
          if [ "${{ matrix.sanitizers }}" = "ON" ]; then
            args+=(-DQtImageViewer_ENABLE_SANITIZER_ADDRESS=ON
                   -DQtImageViewer_ENABLE_SANITIZER_UNDEFINED=ON)
          fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build

      - name: Test
        # The program is a GUI one; the tests do not need a screen, but Qt still
        # wants a platform plugin to exist.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # The analysers are not part of the build matrix: they are slow, they only
  # need one platform, and a finding should be its own red cross rather than a
  # failed "linux gcc Qt 6 Release". Both are warnings-as-errors, so a finding
  # stops the build (see .clang-tidy and cmake/StaticAnalyzers.cmake).
  static-analysis:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-tidy
            analyser: CLANG_TIDY
            # Pinned to the version the checks were tuned against: a new
            # clang-tidy release adds checks, and that should be a deliberate
            # change to .clang-tidy, not a red build one morning.
            package: clang-tidy-18
            program: /usr/bin/clang-tidy-18
          - name: cppcheck
            analyser: CPPCHECK
            package: cppcheck
            program: ''

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1 \
            qt6-base-dev ${{ matrix.package }}

      - name: Configure
        run: |
          args=(-DCMAKE_BUILD_TYPE=Debug
                -DQTIMAGEVIEWER_QT_VERSION=6
                -DQtImageViewer_ENABLE_${{ matrix.analyser }}=ON)
          # Tell CMake which clang-tidy to use; it would look for an unversioned
          # "clang-tidy" otherwise, which the pinned package does not install.
          if [ -n "${{ matrix.program }}" ]; then
            args+=(-DCLANGTIDY=${{ matrix.program }})
          fi
          cmake -S . -B build -G Ninja "${args[@]}" 

      - name: Analyse and build
        run: cmake --build build
