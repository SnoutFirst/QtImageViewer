name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '38 0 * * 5'

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1 qt6-base-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      - name: Configure and build
        run: |
          # No tests and no sanitizers: the analysis is about the code, and
          # address sanitizer fights the tracer CodeQL preloads into the build.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQTIMAGEVIEWER_QT_VERSION=6 -DGIT_SHA=${GITHUB_SHA} \
            -DBUILD_TESTING=OFF -DQtImageViewer_ENABLE_IPO=OFF \
            -DQtImageViewer_ENABLE_SANITIZER_ADDRESS=OFF \
            -DQtImageViewer_ENABLE_SANITIZER_UNDEFINED=OFF
          cmake --build build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
